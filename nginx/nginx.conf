user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 65535;
    multi_accept on;
    accept_mutex off;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 5s;

    gzip on;
    gzip_disable "msie6";

    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Global security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Batasi ukuran upload file
    client_max_body_size 10M;

    server {
        listen 80 default_server;
        server_name _;

        server_tokens off;

        # Blok ekstensi berbahaya (harus dalam server block!)
        location ~* \.(php|sh|py|cgi|exe)$ {
            return 444;
        }

        # Blok metode HTTP berbahaya
        if ($request_method !~ ^(GET|POST|HEAD)$ ) {
            return 444;
        }

        # Proxy ke HAProxy
        location / {
            proxy_pass http://127.0.0.1:31337;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;

            error_page 502 503 504 = @fallback;
        }

        location @fallback {
            root /var/www/html/www;
            try_files $uri /index.html =444;
        }
location ~* ^/(assets|images|css|js|fonts|favicon.ico|robots.txt|sitemap.xml) {
    root /var/www/html/www;
    try_files $uri =444;
}
    }
}
