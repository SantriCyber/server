global
  log /dev/log local0
  log /dev/log local1 notice
  chroot /var/lib/haproxy
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s
  user haproxy
  group haproxy
  daemon
  maxconn 100000
  tune.bufsize 65536
  tune.maxrewrite 4096
  tune.http.maxhdr 128

defaults
  log global
  mode http
  option httplog
  option logasap
  option log-health-checks
  option dontlognull
  option forwardfor
  option http-server-close
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 10s
  timeout http-keep-alive 3s
  maxconn 50000
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 429 /etc/haproxy/errors/429.http

frontend http_front
  bind *:31337
  option httplog
  option logasap
  option log-health-checks
  log global
  log-format "%[var(txn.real_ip)] %ci:%cp [%t] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Tt %ST %B \"%r\""

  # Real IP dari Cloudflare
  http-request set-var(txn.real_ip) req.hdr(CF-Connecting-IP)

  # Block IP permanen
  acl banned_ip src -f /etc/haproxy/banned.lst
  http-request deny if banned_ip

  # Stick table tracking (rate, burst, error)
  stick-table type ip size 500k expire 60s store http_req_rate(10s),http_err_rate(10s),conn_rate(10s),gpc0
  tcp-request connection track-sc0 src
  http-request track-sc0 src

  # Identifikasi path sensitif
  acl is_polling path_beg /message-bus
  acl is_login path_beg /login /session /signup
  acl is_api path_beg /u /notifications /uploads
  acl is_admin path_beg /admin /logs
  acl is_safe_path path_beg -f /etc/haproxy/safe_path.lst

  # DiscourseHub App bypass (jika perlu)
  acl is_discourse_hub hdr_sub(user-agent) -i DiscourseHub
  acl is_sso url_param(auth_redirect) -m found
  http-request allow if is_discourse_hub is_sso
  http-request allow if is_discourse_hub is_polling

  # Allow path aman
  http-request allow if is_safe_path

  # Rate limit: path sangat sensitif
  acl abuse_login sc0_http_req_rate gt 5
  acl abuse_polling sc0_http_req_rate gt 10
  http-request deny deny_status 429 if is_login abuse_login
  http-request deny deny_status 429 if is_polling abuse_polling

  # Rate limit global
  acl global_abuse_req sc0_http_req_rate gt 40
  acl global_abuse_conn sc0_conn_rate gt 15
  http-request deny deny_status 429 if global_abuse_req
  http-request deny deny_status 429 if global_abuse_conn

  # Tolak metode aneh
  acl invalid_method method TRACE CONNECT
  http-request deny deny_status 405 if invalid_method

  # Validasi Host header
  acl valid_host hdr(host) -i forum.santricyber.dev
  http-request deny deny_status 400 if !valid_host
  
  # WebSocket
  acl is_websocket hdr(Upgrade) -i WebSocket
  use_backend discourse_backend if is_websocket

  # Jika backend discourse down, fallback ke nginx dummy
  acl backend_down nbsrv(discourse_backend) lt 1
  use_backend fallback_nginx if backend_down

  default_backend discourse_backend

backend discourse_backend
  option httpchk GET /srv/status
  option forwardfor header CF-Connecting-IP

  http-request set-header X-Real-IP %[req.hdr(CF-Connecting-IP)]
  http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)]
  http-request set-header X-Forwarded-Proto https

  server discourse1 127.0.0.1:41111 check inter 5s fall 3 rise 2

backend fallback_nginx
  server dummy_nginx 127.0.0.1:80 backup
