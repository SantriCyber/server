global
    log /dev/log local0
    log /var/lib/haproxy/dev/log local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 100000
    tune.maxaccept 50
    tune.bufsize 65536
    tune.maxrewrite 4096
    tune.http.maxhdr 128
    lua-load /etc/haproxy/lua/crowdsec_userfriendly.lua

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 300s
    timeout http-request 10s
    timeout http-keep-alive 3s
    timeout tunnel 3600s
    maxconn 50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 429 /etc/haproxy/errors/429.http

listen stats
    bind *:9000
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth santri:cyber123
    stats admin if TRUE

frontend http_front
    bind *:31337
    log global
    option httplog

    # IP asli dari Cloudflare
    http-request set-var(txn.real_ip) req.hdr(CF-Connecting-IP)

    # Stick table tracking by real_ip
    stick-table type ip size 1m expire 30s store http_req_rate(10s),conn_rate(10s)
    tcp-request connection track-sc0 var(txn.real_ip)
    http-request track-sc0 var(txn.real_ip)

    log-format "%[var(txn.real_ip)] %ci:%cp [%t] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Tt %ST %B \"%r\" req_rate=%[sc0_http_req_rate] conn_rate=%[sc0_conn_rate]"

    # Lua CrowdSec
    http-request lua.crowdsec_validate

    # ACL
    acl banned_ip var(txn.real_ip) -m ip -f /etc/haproxy/banned.lst
    acl trusted_ip var(txn.real_ip) -m ip -f /etc/haproxy/trusted.lst
    acl is_safe_path path_beg -f /etc/haproxy/safe_path.lst
    acl is_sourcemap path_end .map
    acl backend_dead nbsrv(discourse_backend) lt 1
    acl high_conn_rate sc0_conn_rate gt 100
    acl high_req_rate  sc0_http_req_rate gt 200
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_event_stream hdr(Accept) -i text/event-stream

    # Filtering & Whitelist
    http-request deny if banned_ip
    http-request allow if trusted_ip
    http-request allow if is_safe_path
    http-request allow if is_sourcemap

    # Rate limit hanya jika backend hidup dan bukan trusted
    http-request deny deny_status 429 if !backend_dead !trusted_ip !is_safe_path high_conn_rate
    http-request deny deny_status 429 if !backend_dead !trusted_ip !is_safe_path high_req_rate

    # Websocket
    http-request set-header Connection "upgrade" if is_websocket
    http-request set-header Upgrade "websocket" if is_websocket
    use_backend discourse_websocket if is_websocket or is_event_stream

    use_backend fallback_nginx if backend_dead
    default_backend discourse_backend

backend discourse_backend
    option httpchk GET /robots.txt HTTP/1.1
    http-check send hdr Host forum.santricyber.dev
    http-check expect status 200
    option forwardfor header CF-Connecting-IP
    http-request set-header X-Real-IP %[req.hdr(CF-Connecting-IP)]
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)]
    http-request set-header X-Forwarded-Proto https
    server discourse1 127.0.0.1:41111 check inter 5s fall 2 rise 3

backend discourse_websocket
    mode http
    option http-server-close
    option forwardfor header CF-Connecting-IP
    http-request set-header Connection "upgrade"
    http-request set-header Upgrade "websocket"
    http-request set-header X-Real-IP %[req.hdr(CF-Connecting-IP)]
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)]
    http-request set-header X-Forwarded-Proto https
    server discourse1 127.0.0.1:41111

backend fallback_nginx
    server dummy_nginx 127.0.0.1:80 backup
