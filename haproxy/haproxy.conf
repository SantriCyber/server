global
  log /dev/log local0
  log /dev/log local1 notice
  chroot /var/lib/haproxy
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s
  user haproxy
  group haproxy
  daemon
  maxconn 100000
  tune.bufsize 65536
  tune.maxrewrite 4096
  tune.http.maxhdr 128

defaults
  log global
  mode http
  option httplog
  option logasap
  option dontlognull
  option forwardfor
  option http-server-close
  timeout connect 5s
  timeout client 60s
  timeout server 300s
  timeout http-request 10s
  timeout http-keep-alive 3s
  timeout tunnel 3600s
  maxconn 50000
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 429 /etc/haproxy/errors/429.http

listen stats
  bind *:9000
  mode http
  stats enable
  stats uri /stats
  stats refresh 5s
  stats show-legends
  stats show-node
  stats auth santri:cyber123
  acl always_true src 0.0.0.0/0
  stats admin if always_true

frontend http_front
  bind *:31337
  option httplog
  option logasap
  log global
  log-format "%[var(txn.real_ip)] %ci:%cp [%t] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Tt %ST %B \"%r\""

  http-request set-var(txn.real_ip) req.hdr(CF-Connecting-IP)

  stick-table type ip size 500k expire 60s store gpc0,http_req_rate(10s),http_err_rate(10s),conn_rate(10s)
  tcp-request connection track-sc0 src
  http-request track-sc0 src

  acl banned_ip src -f /etc/haproxy/banned.lst
  http-request deny if banned_ip

  acl trusted_ip src -f /etc/haproxy/trusted.lst
  http-request allow if trusted_ip

  acl is_polling path_beg /message-bus
  acl is_login path_beg /login /session /signup
  acl is_chat path_beg /chat/api
  acl is_safe_path path_beg -f /etc/haproxy/safe_path.lst
  acl from_cf hdr(CF-Connecting-IP) -m found
  acl is_safe_drafts path_reg ^/chat/api/channels/\d+/(drafts|messages)$

  http-request allow if is_safe_path from_cf
  http-request allow if is_safe_drafts

  http-request sc-inc-gpc0() if METH_POST !is_safe_path !is_safe_drafts
  http-request deny deny_status 429 if { req.fhdr(gpc0) gt 30 }

  acl is_msgbus path_beg /message-bus
  acl is_presence path_beg /presence
  acl is_drafts path_reg ^/chat/api/channels/\d+/(drafts|messages)$

  acl abuse_msgbus sc0_http_req_rate gt 120
  acl abuse_presence sc0_http_req_rate gt 80
  acl abuse_drafts sc0_http_req_rate gt 60

  http-request deny deny_status 429 if is_msgbus abuse_msgbus
  http-request deny deny_status 429 if is_presence abuse_presence
  http-request deny deny_status 429 if is_drafts abuse_drafts

  acl abuse_login sc0_http_req_rate gt 20
  acl abuse_polling sc0_http_req_rate gt 30
  acl abuse_chat sc0_http_req_rate gt 40
  http-request deny deny_status 429 if is_login abuse_login
  http-request deny deny_status 429 if is_polling abuse_polling
  http-request deny deny_status 429 if is_chat abuse_chat

  acl global_abuse_req sc0_http_req_rate gt 500
  acl global_abuse_conn sc0_conn_rate gt 100
  http-request deny deny_status 429 if global_abuse_req
  http-request deny deny_status 429 if global_abuse_conn

  acl invalid_method method TRACE CONNECT
  http-request deny deny_status 405 if invalid_method
  acl valid_host hdr(host) -i forum.santricyber.dev
  http-request deny deny_status 400 if !valid_host

  acl is_websocket hdr(Upgrade) -i WebSocket
  acl is_event_stream hdr(Accept) -i text/event-stream
  http-request set-header Connection "upgrade" if is_websocket
  http-request set-header Upgrade "websocket" if is_websocket
  use_backend discourse_websocket if is_websocket or is_event_stream

  acl backend_down nbsrv(discourse_backend) lt 1
  use_backend fallback_nginx if backend_down

  default_backend discourse_backend

backend discourse_backend
  option httpchk GET /robots.txt HTTP/1.1
  http-check send hdr Host forum.santricyber.dev
  http-check expect status 200
  option forwardfor header CF-Connecting-IP
  http-request set-header X-Real-IP %[req.hdr(CF-Connecting-IP)]
  http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)]
  http-request set-header X-Forwarded-Proto https
  server discourse1 127.0.0.1:41111 check inter 5s fall 2 rise 3

backend discourse_websocket
  mode http
  option http-server-close
  option forwardfor header CF-Connecting-IP
  http-request set-header Connection "upgrade"
  http-request set-header Upgrade "websocket"
  http-request set-header X-Real-IP %[req.hdr(CF-Connecting-IP)]
  http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)]
  http-request set-header X-Forwarded-Proto https
  server discourse1 127.0.0.1:41111

backend fallback_nginx
  server dummy_nginx 127.0.0.1:80 backup
